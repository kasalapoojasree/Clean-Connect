{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container"><div class="cc-card pad auth-card">
  <h2 class="h3">Welcome back</h2><p class="text-muted">Log in to report issues and track your complaints.</p>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.values.get('next', '') }}">
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" required autocomplete="email"></div>
    <div class="mb-4"><label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-cc w-100" type="submit">Log in</button>
  </form>
  <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
