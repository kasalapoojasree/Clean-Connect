{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container"><div class="cc-card pad auth-card">
  <h2 class="h3">Create your account</h2><p class="text-muted">Register to report issues and track their progress.</p>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="name">Full name</label>
      <input class="form-control" id="name" name="name" required minlength="2" maxlength="80" value="{{ form.get('name', '') }}" autocomplete="name"></div>
    <div class="row g-3 mb-3">
      <div class="col-md-6"><label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" required maxlength="120" value="{{ form.get('email', '') }}" autocomplete="email"></div>
      <div class="col-md-6"><label class="form-label" for="phone">Phone</label>
        <input class="form-control" type="tel" id="phone" name="phone" required pattern="\+?\d[\d\s\-]{6,14}" value="{{ form.get('phone', '') }}" autocomplete="tel"></div>
    </div>
    <div class="mb-3"><label class="form-label" for="location">Area / location</label>
      <input class="form-control" id="location" name="location" required maxlength="120" placeholder="e.g. Gandhi Nagar" value="{{ form.get('location', '') }}"></div>
    <div class="row g-3 mb-4">
      <div class="col-md-6"><label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        <div class="form-text">At least 8 characters.</div></div>
      <div class="col-md-6"><label class="form-label" for="confirm_password">Confirm password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
        <div class="invalid-feedback">Passwords must match.</div></div>
    </div>
    <button class="btn btn-cc w-100" type="submit">Create account</button>
  </form>
  <p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div></div>
{% endblock %}
