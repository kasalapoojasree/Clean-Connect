{% extends 'base.html' %}
{% block title %}Administrator Login{% endblock %}
{% block content %}
<div class="container"><div class="cc-card pad auth-card">
  <h2 class="h3"><i class="bi bi-shield-lock"></i> Administrator login</h2>
  <p class="text-muted">Authorised staff only.</p>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="username">Email</label>
      <input class="form-control" id="username" name="username" required autocomplete="email"></div>
    <div class="mb-4"><label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-cc w-100" type="submit">Log in as admin</button>
  </form>
</div></div>
{% endblock %}
